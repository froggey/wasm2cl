name: Rust CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: docker
    container:
      image: rust:latest
    steps:
      - name: Install Node.js (required by JS-based actions like checkout)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends nodejs

      - uses: actions/checkout@v4

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Ensure rustfmt & clippy are installed
        run: rustup component add rustfmt clippy

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-features
